name: Pipeline Python CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:

  build:
    name: Etapa 1 - Build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Instalar o projeto
        run: |
          python3 -m pip install --upgrade pip
          pip install -e .

      - name: Verificar sintaxe
        run: |
          python3 -m compileall -q calculadora.py


  test:
    name: Etapa 2 - Testes
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python3 -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Executar testes
        run: |
          pytest -v


  package:
    name: Etapa 3 - Empacotamento
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramenta de build
        run: |
          python3 -m pip install --upgrade pip
          pip install build

      - name: Gerar pacotes
        run: |
          python3 -m build

      - name: Armazenar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: pacote-python
          path: dist/
