[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calculadora-simples-fatec"
version = "1.0.0"
description = "Exemplo de pacote python CICD"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["calculadora"]
